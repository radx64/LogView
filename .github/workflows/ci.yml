name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  translations:
    name: Validate translations
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Check translation catalogs
      run: python3 scripts/check-translations.py
