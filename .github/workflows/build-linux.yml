name: Build Linux

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          cmake \
          g++ \
          make \
          libgl1-mesa-dev \
          qt6-base-dev \
          qt6-tools-dev

    - name: Create build directory
      run: mkdir -p build

    - name: Configure CMake
      working-directory: build
      run: cmake -DCMAKE_BUILD_TYPE=Release ..

    - name: Build
      working-directory: build
      run: cmake --build . --config Release -j$(nproc)

    - name: Verify binary
      run: |
        [ -f build/LogView ] || exit 1
        echo "Build successful: build/LogView"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LogView-linux-x64
        path: build/LogView
        retention-days: 30
