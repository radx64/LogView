name: Build Linux

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ make libgl1-mesa-dev

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        # 6.7.0-6.7.2 fail to link with GCC 13+ (non-inline
        # QtPrivate::IsFloatType_v<_Float16>); fixed in 6.7.3.
        version: '6.7.3'
        host: linux
        target: desktop
        arch: linux_gcc_64

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release -j$(nproc)

    - name: Build and run unit tests
      run: |
        cmake --build build --config Release --target LogViewTests -j$(nproc)
        ctest --test-dir build -C Release --output-on-failure

    - name: Verify binary
      run: |
        [ -f build/LogView ] || exit 1
        echo "Build successful: build/LogView"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LogView-linux-x64
        path: build/LogView
        retention-days: 30
